<html lang="pt-br">

<body>

    <h2>Atribuição de Métodos</h2>

    <p>Este formulário será enviado utilizando o método POST:</p>

    <form action="/action_page.php" target="_blank" method="post">
        <label for="fname">Primeiro nome:</label><br>
        <input type="text" id="fname" name="fname" value="John"><br>
        <label for="lname">Sobrenome:</label><br>
        <input type="text" id="lname" name="lname" value="Doe"><br><br>
        <input type="submit" value="Enviar">
    </form>

    <p>Após enviar, observe que, ao contrário do método GET, os valores do formulário NÃO ficam visíveis na barra de endereços da
        nova aba do navegador.</p>


</body>

</html>
